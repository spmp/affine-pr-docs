title: AFFiNE fork — PR notes
description: What each pull request in the spmp/AFFiNE stack does, why, and how to review it.
remote_theme: just-the-docs/just-the-docs@v0.10.1
plugins:
  - jekyll-remote-theme
  - jekyll-relative-links
url: https://spmp.github.io
baseurl: /affine-pr-docs
color_scheme: affine
search_enabled: true
heading_anchors: true
aux_links:
  "spmp/AFFiNE on GitHub": https://github.com/spmp/AFFiNE
  "Upstream AFFiNE": https://github.com/toeverything/AFFiNE
# pr-text/ (PR descriptions to paste into GitHub), tools/ and inbox/ are not part of the site.
exclude:
  - pr-text/
  - tools/
  - inbox/
  - README.md
  - Gemfile
  - Gemfile.lock
  # Listing exclude replaces Jekyll's defaults, so re-add the local gem install.
  - vendor/
  - .bundle/
defaults:
  - scope: { path: "" }
    values: { layout: default }
