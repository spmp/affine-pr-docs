# One entry per PR. The overview cards and each page's header picture come
# from here. Picture: drop assets/images/pr-<id>/hero.(png|jpg|gif|webp);
# until then a placeholder is shown.
# `alone: true` = applies cleanly straight onto canary (can be reviewed first).
groups:
  - name: Edgeless canvas
    prs: ["02", "03", "05", "06", "07", "08", "09", "10", "11", "12", "13", "14", "15", "17"]
  - name: Documents, databases and the Journal Todo
    prs: ["18", "19"]
  - name: Mobile
    prs: ["30", "31"]
  - name: Server and PWA
    prs: ["40", "41", "42"]
  - name: Standalone fixes and tidy-ups
    prs: ["50", "51", "00"]

prs:
  "00": { title: "Tidy-up and tools", tagline: "Customised editor settings survive a setting gaining a new field.", size: "5 files", alone: true }
  "02": { title: "Colour palettes", tagline: "Palette sets with gradient fills for shapes, pen and connectors, managed in Settings.", size: "+3.5k", alone: true, shot: "Shape toolbar with the palette selector open, showing 2-3 palettes" }
  "03": { title: "Dotted line style", tagline: "A dotted stroke for shapes, connectors and note borders.", size: "+195", shot: "Line-style panel with the Dot option, and a dotted connector between two shapes" }
  "05": { title: "Connector core", tagline: "Rounded routes, line jumps, waypoints and ~25 new arrowheads including ER notation.", size: "+4.1k", shot: "A small flowchart with rounded orthogonal connectors and a line jump" }
  "06": { title: "Connector from hover", tagline: "Hover a shape, drag a connector straight out of an anchor.", size: "+689", alone: true, shot: "Hover a shape, anchors appear, drag a connector from one" }
  "07": { title: "Flips", tagline: "Flip shapes horizontally and vertically; text stays readable.", size: "+725", shot: "A triangle and an arrow shape, original and flipped, with connectors attached" }
  "08": { title: "Grid and snapping", tagline: "Grid size, snap to grid, and which point of a shape snaps.", size: "+1.4k", shot: "Zoom toolbar grid menu open" }
  "09": { title: "Shapes and edges", tagline: "~60 new general, flowchart and arrow shapes, plus a searchable shape browser.", size: "+13.7k", shot: "The shape browser panel with search" }
  "10": { title: "Library shapes", tagline: "~8,900 draw.io stencils (AWS, GCP, Azure, Cisco…), loaded only when used.", size: "+5.6M generated", shot: "Shape browser showing an AWS category with thumbnails" }
  "11": { title: "Advanced shapes", tagline: "Mind-map and container shapes that collapse.", size: "+1.3k", shot: "Collapsing and expanding a container and a mind-map tree" }
  "12": { title: "Properties panel", tagline: "Every shape and connector setting in one panel, from the … menu or the sidebar.", size: "+2k", shot: "The properties panel open for a connector" }
  "13": { title: "Frame resize", tagline: "Frame embeds sized by zoom, width or aspect ratio; hide grid, inner frames, notes.", size: "+1.3k", shot: "A frame embed in a page at full width vs page width" }
  "14": { title: "PNG metadata", tagline: "Exported PNGs carry the frame; drop one back in to edit it again.", size: "+1.6k", alone: true, shot: "Export a frame as PNG, then drop the PNG back to get an editable frame" }
  "15": { title: "Markdown/HTML export-import", tagline: "Frames survive a round trip through Markdown and HTML.", size: "+1.6k", shot: "A page with a frame embed, exported to Markdown and re-imported" }
  "17": { title: "Middle-click paste guard", tagline: "A regression test so the Linux middle-click paste setting keeps working.", size: "+57", alone: true }
  "18": { title: "Reusable blocks", tagline: "Show a note or table from any page in place, live and editable.", size: "+11k", shot: "The same note shown on two pages, edited on one, updated on the other" }
  "19": { title: "To-do lists, databases and the Journal Todo", tagline: "Tasks with hierarchy, a List view that types like a to-do list, and one task table on every journal page.", size: "+32.7k", shot: "A nested to-do list and the same tasks as a table with hierarchy" }
  "30": { title: "Mobile keyboard toolbar", tagline: "The toolbar sits on the iOS keyboard, with database and reference tools.", size: "+3.7k", shot: "IPhone screenshot, keyboard open, toolbar sitting on it" }
  "31": { title: "Mobile settings", tagline: "Open the full settings from a phone.", size: "+292", alone: true, shot: "Mobile settings with the new entry, and the full settings open on a phone" }
  "40": { title: "Server compression", tagline: "Compressed assets and API responses for self-hosted servers.", size: "+34", alone: true }
  "41": { title: "PWA", tagline: "Install AFFiNE to the home screen and open it offline.", size: "+3.5k", shot: "IPhone in airplane mode opening AFFiNE from the home screen" }
  "42": { title: "Debug back channel", tagline: "Logs and remote eval for debugging on a live device. Not ready for upstream.", size: "+1.4k", status: "Not ready" }
  "50": { title: "Store parent index", tagline: "Typing on long pages is faster: parent lookup no longer scans the whole doc.", size: "+226", alone: true }
  "51": { title: "Toast container", tagline: "Toasts show again after leaving the page they first appeared on.", size: "+4", alone: true }
