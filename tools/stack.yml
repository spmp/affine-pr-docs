  - { working: working/pr/31-mobile-settings, publish: pr/31-mobile-settings, base: canary, upstream: 15842 }

  # Server and PWA.
  - { working: working/pr/40-server-compression, publish: pr/40-server-compression, base: canary, upstream: 15843 }
  - { working: working/pr/41-server-pwa, publish: pr/41-server-pwa, base: canary, upstream: 15844, status: tentative }   # canary once the stencil-utils hunk is dropped
  - { working: working/pr/42-mobile-debug-tools }   # fork only for now

  # Fork only: build, deploy, fork tooling. Never published.
  - { working: working/pr/N-build }
